name: Keep scheduled workflows alive

# GitHub auto-disables scheduled workflows after 60 days with no repo activity.
# This makes a tiny monthly commit so the daily/weekly/monthly workflows never
# get silently switched off.
on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update heartbeat file
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > .heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .heartbeat
          git commit -m "chore: keepalive heartbeat" || echo "Nothing to commit"
          git push
